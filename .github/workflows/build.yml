name: Build OldGL4ES plugin

on:
  push:
  workflow_dispatch:
    inputs:
      gl4es_repo:
        description: "GL4ES git repository"
        default: "https://github.com/ptitSeb/gl4es.git"
      gl4es_ref:
        description: "GL4ES branch, tag or commit"
        default: "master"

env:
  GL4ES_REPO: ${{ github.event.inputs.gl4es_repo || 'https://github.com/ptitSeb/gl4es.git' }}
  GL4ES_REF: ${{ github.event.inputs.gl4es_ref || 'master' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fetch GL4ES source
        run: |
          git clone "$GL4ES_REPO" gl4es-src
          cd gl4es-src
          git checkout "$GL4ES_REF"
          git log -1 --oneline

      # Optional: put your own changes to GL4ES as .patch files in ./patches
      - name: Apply patches
        run: |
          if ls patches/*.patch >/dev/null 2>&1; then
            cd gl4es-src
            for p in ../patches/*.patch; do
              echo "Applying $p"
              git apply "$p"
            done
          else
            echo "No patches"
          fi

      - name: Build GL4ES with the Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          build_abi() {
            ABI="$1"
            cmake -S gl4es-src -B "build-$ABI" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-26 \
              -DCMAKE_BUILD_TYPE=Release \
              -DANDROID=ON \
              -DCMAKE_C_FLAGS="-O3"
            cmake --build "build-$ABI" -j"$(nproc)"
            LIB="$(find "build-$ABI" -name 'libGL.so' | head -n1)"
            test -n "$LIB" || { echo "libGL.so not found for $ABI"; find "build-$ABI" -name '*.so'; exit 1; }
            mkdir -p "app/src/main/jniLibs/$ABI"
            cp "$LIB" "app/src/main/jniLibs/$ABI/libgl4es.so"
          }
          build_abi arm64-v8a
          build_abi armeabi-v7a
          ls -l app/src/main/jniLibs/*/

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: OldGL4ES-plugin
          path: app/build/outputs/apk/debug/*.apk
