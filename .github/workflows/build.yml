# ============================================================================
#  OldGL4ES - renderer plugin for Fold Craft Launcher
#
#  Flow:  fetch GL4ES -> (optional patches) -> scripts/build-gl4es.sh
#         -> build the APK -> upload it as an artifact.
# ============================================================================
name: Build OldGL4ES plugin

on:
  push:
  workflow_dispatch:
    inputs:
      gl4es_repo:
        description: "GL4ES git repository"
        default: "https://github.com/ptitSeb/gl4es.git"
      gl4es_ref:
        description: "GL4ES branch, tag or commit"
        default: "master"

env:
  GL4ES_REPO: ${{ github.event.inputs.gl4es_repo || 'https://github.com/ptitSeb/gl4es.git' }}
  GL4ES_REF: ${{ github.event.inputs.gl4es_ref || 'master' }}
  ABIS: "arm64-v8a armeabi-v7a"
  ANDROID_API: "26"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: "1. Checkout plugin project"
        uses: actions/checkout@v5

      - name: "2. Set up Java 17"
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: "3. Fetch GL4ES source"
        run: |
          git clone "$GL4ES_REPO" gl4es-src
          cd gl4es-src
          git checkout "$GL4ES_REF"
          git log -1 --oneline

      - name: "4. Apply patches (./patches/*.patch)"
        run: |
          if ls patches/*.patch >/dev/null 2>&1; then
            cd gl4es-src
            for p in ../patches/*.patch; do
              echo "Applying $p"
              git apply "$p"
            done
          else
            echo "No patches"
          fi

      - name: "5. Build GL4ES for each ABI (Android NDK)"
        run: bash scripts/build-gl4es.sh

      - name: "6. Set up Gradle"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: "7. Build APK"
        run: gradle assembleDebug --no-daemon

      - name: "8. Upload APK"
        uses: actions/upload-artifact@v4
        with:
          name: OldGL4ES-plugin
          path: app/build/outputs/apk/debug/*.apk
